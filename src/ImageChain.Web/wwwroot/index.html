<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageChain 配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f1117;color:#e1e4e8;line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:20px}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}.log-card{height:400px!important}.layout-right{position:static!important}}
.layout-right{position:sticky;top:20px}
.log-card{display:flex;flex-direction:column;height:calc(100vh - 120px)}
.log-card h2{flex:0 0 auto}
.log-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:0 0 auto}
.log-title{font-weight:700;color:#c9d1d9}
.log-live{font-size:.75rem;color:#3fb950}
#log-view{flex:1;overflow:auto;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.75rem;line-height:1.6;color:#adbac7}
.log-line{padding:1px 5px;border-radius:3px;white-space:pre-wrap;word-break:break-word}
.log-line:hover{background:#1c2128}
.log-time{color:#636e7b;margin-right:6px}
.log-info{color:#adbac7}
.log-warn{color:#d29922;background:rgba(158,106,3,.08)}
.log-err{color:#f85149;background:rgba(218,54,51,.08)}
.log-model{color:#58a6ff}
.log-trace{color:#6e7681}
.log-k{display:inline-block;background:rgba(31,111,235,.2);color:#58a6ff;border-radius:3px;padding:0 5px;font-size:.68rem;font-weight:700;margin-right:4px}
.log-k-resp{background:rgba(35,134,54,.2);color:#3fb950}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1100}
.modal-box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1101;width:min(640px,92vw);max-height:88vh;display:flex;flex-direction:column;background:#161b22;border:1px solid #30363d;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #30363d}
.modal-body{flex:1;overflow:auto;padding:18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #30363d;background:#0d1117}
.modal-body textarea{resize:vertical}
.caps{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px;margin-bottom:12px}
.cap{flex:1;display:flex;flex-direction:column;gap:4px}
.cap label{font-size:.875rem;color:#c9d1d9;display:flex;align-items:center;gap:6px}
.cap label input[type=checkbox]{width:auto}
h1{font-size:1.5rem;margin-bottom:20px;color:#58a6ff}
h2{font-size:1.1rem;margin:16px 0 8px;color:#c9d1d9}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:16px}
.btn{padding:6px 14px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:.875rem;white-space:nowrap}
.btn:hover{background:#30363d}
.btn-primary{background:#238636;border-color:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-danger{background:#da3633;border-color:#da3633;color:#fff}
.btn-danger:hover{background:#f85149}
input,select{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px 10px;color:#c9d1d9;font-size:.875rem;width:100%}
label{display:block;font-size:.875rem;color:#8b949e;margin-bottom:4px}
.row{display:flex;gap:12px;align-items:end;margin-bottom:12px}
.row>div{flex:1}
.hidden{display:none}
.model-item{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;margin-bottom:6px;cursor:grab;display:flex;align-items:center;gap:12px}
.model-item:active{cursor:grabbing}
.model-item .priority{font-weight:700;color:#58a6ff;min-width:24px}
.model-item .info{flex:1}
.model-item .vendor-tag{font-size:.75rem;padding:2px 6px;border-radius:4px;background:#1f6feb33;color:#58a6ff}
.model-item .actions{display:flex;gap:6px}
.badge{display:inline-block;font-size:.75rem;padding:2px 6px;border-radius:4px;margin-right:4px}
.badge-green{background:#23863633;color:#3fb950}
.badge-yellow{background:#9e6a0333;color:#d29922}
.status{padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:.875rem}
.status-ok{background:#23863633;color:#3fb950;border:1px solid #238636}
.status-err{background:#da363333;color:#f85149;border:1px solid #da3636}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ctx-menu{position:fixed;z-index:1000;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:4px;display:none;min-width:110px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#ctx-menu .ctx-item{padding:6px 12px;cursor:pointer;font-size:.875rem;color:#c9d1d9;border-radius:4px;white-space:nowrap}
#ctx-menu .ctx-item:hover{background:#1f6feb;color:#fff}
#ctx-menu .ctx-sep{height:1px;background:#30363d;margin:4px 0}
#toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 18px;border-radius:6px;font-size:.875rem;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:toastIn .25s ease-out}
.toast-ok{background:#238636;border:1px solid #2ea043}
.toast-err{background:#da3633;border:1px solid #f85149}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
#loading-overlay{position:fixed;inset:0;background:rgba(13,17,23,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999;color:#c9d1d9;font-size:.95rem}
#loading-overlay.hidden{display:none}
#loading-overlay .spinner{width:34px;height:34px;border-width:3px}
#loading-overlay .loading-text{color:#58a6ff;font-size:1rem}
</style>
</head>
<body>
<div class="container">
<h1>ImageChain 配置管理</h1>

<div id="login-section">
<div class="card">
<h2>登录</h2>
<div class="row" style="max-width:400px">
<div><input id="pw" type="password" placeholder="管理员密码" onkeydown="if(event.key==='Enter')doLogin()"></div>
<div><button class="btn btn-primary" onclick="doLogin()">登录</button></div>
</div>
<div id="login-status"></div>
</div>
</div>

<div id="main-section" class="hidden">
<div class="layout">
<div class="layout-left">
<div class="card">
<h2>厂商管理</h2>
<div id="vendor-list"></div>
<div class="row" style="margin-top:12px">
<div><input id="new-vendor-name" placeholder="厂商名称（如 Combo / OpenAI）"></div>
<div><input id="new-vendor-endpoint" placeholder="接口地址"></div>
<div><input id="new-vendor-key" type="password" placeholder="API Key"></div>
<div style="flex:0"><button class="btn btn-primary" onclick="addVendor()">添加厂商</button></div>
</div>
</div>

<div class="card">
<h2>模型列表 <small style="color:#8b949e">（拖拽调整优先级）</small></h2>
<div id="model-list"></div>
</div>

<div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
<button class="btn" onclick="exportConfig()">导出 JSON</button>
<button class="btn" onclick="document.getElementById('import-file').click()">导入 JSON</button>
<input type="file" id="import-file" accept=".json" class="hidden" onchange="importConfig(event)">
</div>
</div>

<div class="layout-right">
<div class="card log-card">
<h2>实时日志</h2>
<div class="log-toolbar">
<span class="log-title">日志输出</span>
<span class="log-live">● 监听中</span>
<button class="btn" onclick="clearLogs()">清空</button>
</div>
<div id="log-view">连接中…</div>
</div>
</div>
</div>

<div id="toast-container"></div>

<div id="loading-overlay" class="hidden">
<div class="spinner"></div>
<div class="loading-text">模型加载中…</div>
</div>

<div id="ctx-menu">
<div class="ctx-item" onclick="openModelSettings()">设置</div>
<div class="ctx-sep"></div>
<div class="ctx-item" onclick="menuPinToTop()">置顶</div>
<div class="ctx-item" onclick="menuPinToBottom()">置底</div>
</div>
</div>

<div id="settings-modal" class="hidden">
<div class="modal-bg" onclick="closeSettings()"></div>
<div class="modal-box">
<div class="modal-head">
<div><strong>模型设置</strong> <span id="settings-title" style="color:#8b949e"></span></div>
<button class="btn" onclick="closeSettings()" style="padding:2px 10px">✕</button>
</div>
<div class="modal-body">
<div class="row">
<div><label>显示名称</label><input id="set-display"></div>
<div style="flex:0"><label>启用</label><div><input id="set-enabled" type="checkbox"></div></div>
</div>
<div class="row">
<div><label>重试次数</label><input id="set-retry" type="number" min="0"></div>
<div><label>响应图片路径</label><input id="set-resppath" placeholder="[0].url"></div>
</div>
<div class="caps">
<h2 style="margin:0 0 8px">能力</h2>
<div class="row">
<div class="cap"><label><input type="checkbox" id="cap-t2i"> 文生图 TextToImage</label><label>优先级 <input id="pri-t2i" type="number" min="1" style="width:80px"></label></div>
<div class="cap"><label><input type="checkbox" id="cap-i2i"> 图生图 ImageToImage</label><label>优先级 <input id="pri-i2i" type="number" min="1" style="width:80px"></label></div>
</div>
</div>
<label>默认参数 (JSON)</label>
<textarea id="set-params" rows="3" placeholder='{"size":"1024x1024"}'></textarea>
<label>请求模板 (JSON)</label>
<textarea id="set-template" rows="3" placeholder='{}'></textarea>
<div id="settings-status"></div>
</div>
<div class="modal-foot">
<button class="btn" onclick="closeSettings()">取消</button>
<button class="btn btn-primary" onclick="saveModelSettings()">保存</button>
</div>
</div>
</div>

<script>
const api=(path,opts)=>fetch(path,{credentials:'include',...opts}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d});
let models=[];

async function doLogin(){
  const pw=document.getElementById('pw').value;
  try{
    await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    showMain();
  }catch(e){document.getElementById('login-status').innerHTML=`<div class="status status-err">${e.message}</div>`}
}

function showMain(){
  document.getElementById('login-section').classList.add('hidden');
  document.getElementById('main-section').classList.remove('hidden');
  loadAll();
  pollLogs();
  logPollId=setInterval(pollLogs,2000);
}

async function init(){
  try{
    await api('/api/admin/me');
    showMain();
  }catch(e){}
}
init();

let logSeq=0;
let logPollId=null;
const logBuf=[];
async function pollLogs(){
  try{
    const r=await fetch('/api/log/poll?after='+logSeq,{credentials:'include'});
    if(r.status===401){
      clearInterval(logPollId);
      document.getElementById('log-view').innerHTML='<div class="log-line log-err" style="padding:24px;text-align:center;font-size:.9rem">会话已过期，请刷新页面重新登录</div>';
      return;
    }
    const d=await r.json();
    if(d.lines&&d.lines.length){
      for(const raw of d.lines){
        const i=raw.indexOf('|'),j=raw.indexOf('|',i+1);
        if(i<0||j<0){logBuf.push({t:'',l:'Info',m:raw});continue;}
        logBuf.push({t:raw.slice(0,i),l:raw.slice(i+1,j),m:raw.slice(j+1)});
      }
      if(logBuf.length>2000)logBuf.splice(0,logBuf.length-2000);
      renderLogs();
    }
    logSeq=d.seq;
  }catch(e){}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtLog(m){
  m=m.replace(/\[REQ\]\s*/,'<span class="log-k">请求接口</span>');
  m=m.replace(/\[RESP\]\s*/,'<span class="log-k log-k-resp">返回结果</span>');
  m=m.replace(/(→ 调用模型 )(.+)$/g,'$1<b class="log-model">$2</b>');
  m=m.replace(/(切换到下一个模型 \[)([^\]]+)\]/g,'$1<b class="log-model">$2</b>]');
  m=m.replace(/(模型 )(.+?)( 生成成功)/g,'$1<b class="log-model">$2</b>$3');
  m=m.replace(/(\[[^\]]+\])( 第 \d+ 次调用失败)/g,'<b class="log-model">$1</b>$2');
  m=m.replace(/(\[[^\]]+\])( 调用失败，)/g,'<b class="log-model">$1</b>$2');
  m=m.replace(/(\[[^\]]+\])( 已用尽重试)/g,'<b class="log-model">$1</b>$2');
  m=m.replace(/\[([0-9a-f]{12})\]/g,'<span class="log-trace">[$1]</span>');
  return m;
}
function renderLogs(){
  const view=document.getElementById('log-view');
  const nearBottom=view.scrollHeight-view.scrollTop-view.clientHeight<60;
  let html='';
  for(const e of logBuf){
    const lv=e.l==='Warn'?'warn':(e.l==='Error'||e.l==='Critical'?'err':'info');
    html+=`<div class="log-line log-${lv}"><span class="log-time">${esc(e.t)}</span>${fmtLog(esc(e.m))}</div>`;
  }
  view.innerHTML=html;
  if(nearBottom)view.scrollTop=view.scrollHeight;
}
function clearLogs(){
  api('/api/log/clear',{method:'POST'}).then(d=>{
    logSeq=d.seq;logBuf.length=0;renderLogs();
  }).catch(e=>alert('清空失败: '+e.message));
}

async function loadAll(){
  await loadVendors();
  await loadModels();
}

async function loadVendors(){
  const vendors=await api('/api/config/vendors');
  let html='';
  vendors.forEach(v=>{
    html+=`<div class="model-item">
      <div class="info"><strong>${v.name}</strong> <span class="vendor-tag">${v.authType}</span><br>
      <small style="color:#8b949e">${v.baseEndpoint} | 密钥: ${v.apiKey}</small></div>
      <div class="actions">
        <button class="btn" onclick="discover('${v.name}')">发现模型</button>
        <button class="btn btn-danger" onclick="deleteVendor('${v.name}')">×</button>
      </div>
    </div>`;
  });
  document.getElementById('vendor-list').innerHTML=html||'<p style="color:#8b949e">尚未配置厂商</p>';
}

async function loadModels(){
  models=await api('/api/config/models');
  renderModels();
}

function renderModels(){
  let html='';
  models.forEach((m,i)=>{
    const caps=Object.keys(m.capabilities||{}).map(c=>`<span class="badge badge-green">${c==='TextToImage'?'文生图':c==='ImageToImage'?'图生图':c}</span>`).join('');
    html+=`<div class="model-item" draggable="true" data-idx="${i}" data-vendor="${m.vendor}" data-model="${m.id}"
      title="拖拽排序，右键置顶"
      ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event)" oncontextmenu="showCtxMenu(event,'${m.vendor}','${m.id}');return false">
      <div class="priority">#${i+1}</div>
      <div class="info"><strong>${m.displayName||m.id}</strong> <span class="vendor-tag">${m.vendor}</span> ${caps}<br>
      <small style="color:#8b949e">重试次数: ${m.retryCount} | ${m.id}</small></div>
      <div class="actions">
        <button class="btn" onclick="toggleModel('${m.vendor}','${m.id}',${!m.enabled})">${m.enabled?'禁用':'启用'}</button>
      </div>
    </div>`;
  });
  document.getElementById('model-list').innerHTML=html||'<p style="color:#8b949e">暂无模型，点击厂商的「发现模型」获取</p>';
}

let dragIdx=null;
function dragStart(e){dragIdx=+e.target.dataset.idx;e.target.style.opacity='.4'}
function dragOver(e){e.preventDefault()}
async function drop(e){
  e.preventDefault();const dropIdx=+e.target.closest('.model-item')?.dataset.idx;
  if(dragIdx===null||dropIdx===undefined||dragIdx===dropIdx)return;
  const item=models.splice(dragIdx,1)[0];models.splice(dropIdx,0,item);
  renderModels();dragIdx=null;
}

function pinToTop(vendor,modelId){
  const idx=models.findIndex(m=>m.vendor===vendor&&m.id===modelId);
  if(idx<=0)return;
  const item=models.splice(idx,1)[0];
  models.unshift(item);
  renderModels();
}

function pinToBottom(vendor,modelId){
  const idx=models.findIndex(m=>m.vendor===vendor&&m.id===modelId);
  if(idx<0||idx===models.length-1)return;
  const item=models.splice(idx,1)[0];
  models.push(item);
  renderModels();
}

let ctxModel=null;
function showCtxMenu(e,vendor,modelId){
  e.preventDefault();
  hideCtxMenu();
  ctxModel={vendor,modelId};
  const menu=document.getElementById('ctx-menu');
  menu.style.display='block';
  const rect=menu.getBoundingClientRect();
  menu.style.left=Math.min(e.clientX,window.innerWidth-rect.width-8)+'px';
  menu.style.top=Math.min(e.clientY,window.innerHeight-rect.height-8)+'px';
}
function hideCtxMenu(){
  document.getElementById('ctx-menu').style.display='none';
  ctxModel=null;
}
function menuPinToTop(){
  if(ctxModel)pinToTop(ctxModel.vendor,ctxModel.modelId);
  hideCtxMenu();
}
function menuPinToBottom(){
  if(ctxModel)pinToBottom(ctxModel.vendor,ctxModel.modelId);
  hideCtxMenu();
}
document.addEventListener('click',()=>hideCtxMenu());
document.addEventListener('contextmenu',e=>{if(!e.target.closest('.model-item'))hideCtxMenu();});

let settingsModel=null;
function openModelSettings(){
  if(!ctxModel)return;
  const m=models.find(x=>x.vendor===ctxModel.vendor&&x.id===ctxModel.modelId);
  hideCtxMenu();
  if(!m)return;
  settingsModel=m;
  document.getElementById('settings-title').textContent=`${m.vendor} / ${m.id}`;
  document.getElementById('set-display').value=m.displayName||m.id;
  document.getElementById('set-enabled').checked=!!m.enabled;
  document.getElementById('set-retry').value=m.retryCount??1;
  document.getElementById('set-resppath').value=m.responseImagePath||'';
  const caps=m.capabilities||{};
  document.getElementById('cap-t2i').checked=!!caps.TextToImage;
  document.getElementById('pri-t2i').value=(caps.TextToImage&&caps.TextToImage.priority)||10;
  document.getElementById('cap-i2i').checked=!!caps.ImageToImage;
  document.getElementById('pri-i2i').value=(caps.ImageToImage&&caps.ImageToImage.priority)||10;
  document.getElementById('set-params').value=m.defaultParameters?JSON.stringify(m.defaultParameters,null,2):'';
  document.getElementById('set-template').value=m.requestTemplate?JSON.stringify(m.requestTemplate,null,2):'';
  document.getElementById('settings-status').innerHTML='';
  document.getElementById('settings-modal').classList.remove('hidden');
}
function closeSettings(){
  document.getElementById('settings-modal').classList.add('hidden');
  settingsModel=null;
}
function settingsMsg(msg,err){
  document.getElementById('settings-status').innerHTML=`<div class="status ${err?'status-err':'status-ok'}">${msg}</div>`;
}
async function saveModelSettings(){
  if(!settingsModel)return;
  const pv=document.getElementById('set-params').value.trim();
  const tv=document.getElementById('set-template').value.trim();
  let params=null,template=null;
  try{params=pv?JSON.parse(pv):null;}catch(e){return settingsMsg('默认参数 JSON 格式错误: '+e.message,true)}
  try{template=tv?JSON.parse(tv):null;}catch(e){return settingsMsg('请求模板 JSON 格式错误: '+e.message,true)}
  const caps={};
  if(document.getElementById('cap-t2i').checked)caps.TextToImage={priority:+document.getElementById('pri-t2i').value||10};
  if(document.getElementById('cap-i2i').checked)caps.ImageToImage={priority:+document.getElementById('pri-i2i').value||10};
  if(!Object.keys(caps).length)return settingsMsg('至少选择一个能力',true);
  const body={
    id:settingsModel.id,
    displayName:document.getElementById('set-display').value.trim()||settingsModel.id,
    enabled:document.getElementById('set-enabled').checked,
    retryCount:+document.getElementById('set-retry').value||0,
    capabilities:caps,
    defaultParameters:params,
    requestTemplate:template,
    responseImagePath:document.getElementById('set-resppath').value.trim()||null
  };
  try{
    await api(`/api/config/models/update?vendor=${encodeURIComponent(settingsModel.vendor)}&modelId=${encodeURIComponent(settingsModel.id)}`,
      {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    settingsMsg('已保存',false);
    await loadModels();
    setTimeout(closeSettings,600);
  }catch(e){settingsMsg('保存失败: '+e.message,true)}
}

async function addVendor(){
  const name=document.getElementById('new-vendor-name').value.trim();
  const endpoint=document.getElementById('new-vendor-endpoint').value.trim();
  const key=document.getElementById('new-vendor-key').value.trim();
  if(!name||!endpoint)return alert('请填写厂商名称和接口地址');
  await api('/api/config/vendors',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,baseEndpoint:endpoint,apiKey:key,authType:'Bearer',models:[]})});
  loadVendors();
}

async function deleteVendor(name){
  if(!confirm(`确认删除厂商 ${name}？`))return;
  await api(`/api/config/vendors/${name}`,{method:'DELETE'});loadVendors();
}

async function discover(vendor){
  const overlay=document.getElementById('loading-overlay');
  overlay.classList.remove('hidden');
  try{
    const discovered=await api(`/api/config/vendors/${vendor}/discover`,{method:'POST'});
    if(!discovered.length)return alert('未找到可用的图像模型');
    const vendorData=await api('/api/config/vendors');
    const v=vendorData.find(x=>x.name===vendor);
    if(!v)return;
    const existingIds=new Set((v.models||[]).map(m=>m.id));
    let added=0;
    for(const m of discovered){
      if(existingIds.has(m.id))continue;
      const capabilities=(m.capabilities||['TextToImage']);
      const caps={};
      capabilities.forEach(c=>caps[c==='ImageToImage'?'ImageToImage':'TextToImage']={priority:10});
      v.models.push({id:m.id,displayName:m.displayName||m.id,enabled:true,retryCount:1,
        capabilities:caps,defaultParameters:{}});
      added++;
    }
    await api('/api/config/vendors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
    alert(`已从 ${vendor} 新增 ${added} 个模型`);
    loadVendors();loadModels();
  }catch(e){alert('模型发现失败: '+e.message)}
  finally{overlay.classList.add('hidden')}
}

async function toggleModel(vendor,modelId,enabled){
  const m=models.find(x=>x.vendor===vendor&&x.id===modelId);
  if(!m)return;
  m.enabled=enabled;
  await api(`/api/config/models/update?vendor=${encodeURIComponent(vendor)}&modelId=${encodeURIComponent(modelId)}`,
    {method:'PUT',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({id:modelId,displayName:m.displayName,enabled,retryCount:m.retryCount,
       capabilities:m.capabilities,defaultParameters:m.defaultParameters,
       requestTemplate:m.requestTemplate??null,responseImagePath:m.responseImagePath??null})});
  loadModels();
}

function showToast(msg,type='ok',ms=3000){
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  el.textContent=msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},ms);
}

async function saveConfig(){
  try{
    const items=models.map((m,i)=>{
      const caps={};
      for(const k of Object.keys(m.capabilities||{}))caps[k]={priority:i+1};
      return {vendor:m.vendor,modelId:m.id,capabilities:caps};
    });
    await api('/api/config/models/reorder',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(items)});
    showToast('配置已保存','ok');
    loadModels();
  }catch(e){
    showToast('保存失败: '+e.message,'err',5000);
  }
}

async function exportConfig(){
  const r=await fetch('/api/config/export',{credentials:'include'});
  const blob=await r.blob();const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='imagechain-config.json';a.click();
}

async function importConfig(e){
  const file=e.target.files[0];if(!file)return;
  const text=await file.text();
  await api('/api/config/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(text)});
  loadAll();
}
</script>
